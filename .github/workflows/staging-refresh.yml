name: Espelhar produção em staging

# Staging aponta para o ambiente de **homologação** da SEFAZ, e homologação não devolve nota real:
# a distribuição roda, responde, e traz nada. Sem isso staging fica sem massa, e o que se testa lá
# é tela vazia. Uma vez por semana este job traz a base de produção inteira para staging.
#
# Ele **escreve em banco vivo** — é o oposto do `restore-test.yml`, que restaura num Postgres
# efêmero e recusa qualquer alvo que não seja `localhost`. Por isso a guarda aqui é a imagem
# espelhada daquela: em vez de exigir alvo descartável, exige que o alvo **não** seja produção, e
# para o job antes de baixar qualquer coisa.
#
# Reaproveita duas máquinas que já existem, em vez de abrir caminho novo até o banco de produção:
# o ciclo de backup (`db-backups/<ambiente>/manifest.jsonl`, mesmo formato que o `restore-test.yml`
# consome) e o padrão de cópia entre buckets do `bucket-mirror.yml`. Nenhum passo aqui se conecta
# ao Postgres de produção.
#
# ⚠️ Consequência de LGPD, registrada por escrito: staging passa a conter os mesmos dados pessoais
# de terceiros que produção — CPF/CNPJ, nome, endereço e telefone de destinatário, mais os XML
# assinados, que não têm como ser mascarados sem quebrar a assinatura. A decisão foi consciente
# (replicar o ambiente é o objetivo), e o preço é que **staging passa a merecer o mesmo controle de
# acesso de produção**. Ver `docs/SECURITY.md`.
on:
  schedule:
    # Domingo de madrugada: o ciclo de backup da noite já fechou, e ninguém está testando.
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Vincula os segredos de staging. As credenciais de leitura do backup e do bucket fiscal de
    # produção são de repositório (as mesmas que `restore-test.yml` e `bucket-mirror.yml` usam), e
    # continuam disponíveis aqui.
    environment: staging
    env:
      # Origem: o backup cifrado de produção.
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      # Qual ambiente do bucket de ops é a origem. Explícito de propósito: `restore-test.yml`
      # aprendeu que sem isso o caminho colapsa e o job fala sobre o manifesto errado.
      SOURCE_BACKUP_ENVIRONMENT: ${{ vars.PRODUCTION_BACKUP_ENVIRONMENT }}
      # Só o banco da aplicação atravessa. O do Keycloak **não** — ver a guarda abaixo.
      APPLICATION_DATABASE_NAME: ${{ vars.APPLICATION_DATABASE_NAME }}

      # Alvo: o banco de staging, e o host de produção que ele nunca pode ser.
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}

      # Bucket fiscal: produção lê, staging escreve, credencial separada de cada lado.
      FISCAL_SOURCE_S3_ACCESS_KEY_ID: ${{ secrets.FISCAL_SOURCE_S3_ACCESS_KEY_ID }}
      FISCAL_SOURCE_S3_SECRET_ACCESS_KEY: ${{ secrets.FISCAL_SOURCE_S3_SECRET_ACCESS_KEY }}
      FISCAL_SOURCE_S3_ENDPOINT: ${{ vars.FISCAL_SOURCE_S3_ENDPOINT }}
      FISCAL_SOURCE_S3_BUCKET: ${{ vars.FISCAL_SOURCE_S3_BUCKET }}
      FISCAL_SOURCE_S3_REGION: ${{ vars.FISCAL_SOURCE_S3_REGION }}
      STAGING_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_S3_ACCESS_KEY_ID }}
      STAGING_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_S3_SECRET_ACCESS_KEY }}
      STAGING_S3_ENDPOINT: ${{ vars.STAGING_S3_ENDPOINT }}
      STAGING_S3_BUCKET: ${{ vars.STAGING_S3_BUCKET }}
      STAGING_S3_REGION: ${{ vars.STAGING_S3_REGION }}
    steps:
      # A guarda vem antes de tudo, inclusive do download: alvo errado descoberto depois do
      # `pg_restore --clean` é tarde — os objetos já caíram.
      - name: Recusar qualquer alvo que seja produção
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "${STAGING_DATABASE_URL:-}" ] || fail "STAGING_DATABASE_URL vazio — o job não adivinha o alvo."
          [ -n "${PRODUCTION_DATABASE_HOST:-}" ] || \
            fail "PRODUCTION_DATABASE_HOST vazio — sem ele não existe o que comparar, e a guarda seria decorativa."
          [ -n "${SOURCE_BACKUP_ENVIRONMENT:-}" ] || \
            fail "PRODUCTION_BACKUP_ENVIRONMENT vazio — o job não adivinha de qual ambiente é o backup."
          [ -n "${APPLICATION_DATABASE_NAME:-}" ] || \
            fail "APPLICATION_DATABASE_NAME vazio — sem ele o job não sabe qual das duas linhas do ciclo restaurar."

          target_host="${STAGING_DATABASE_URL#*@}"
          target_host="${target_host%%:*}"
          target_host="${target_host%%/*}"
          if [ "$target_host" = "$PRODUCTION_DATABASE_HOST" ]; then
            fail "o alvo '${target_host}' é o host de produção — este job restaura POR CIMA do alvo e nunca escreve em produção."
          fi
          echo "alvo: ${target_host} (confirmado diferente de produção)"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/api-transportada/package.json

      # Espelha o bucket **antes** do banco. A ordem importa: o banco referencia `bucket`/`key`, e
      # linha sem objeto é documento fiscal que não existe (mesma razão do `bucket-mirror.yml`).
      # Copiar objeto que ainda não tem linha é inofensivo; o contrário, não.
      - name: Espelhar o bucket fiscal de produção em staging
        run: |
          set -euo pipefail
          source_ls() {
            AWS_ACCESS_KEY_ID="$FISCAL_SOURCE_S3_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$FISCAL_SOURCE_S3_SECRET_ACCESS_KEY" \
            aws s3 ls "s3://${FISCAL_SOURCE_S3_BUCKET}/" --recursive \
              --endpoint-url "$FISCAL_SOURCE_S3_ENDPOINT" --region "$FISCAL_SOURCE_S3_REGION"
          }
          target_ls() {
            AWS_ACCESS_KEY_ID="$STAGING_S3_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$STAGING_S3_SECRET_ACCESS_KEY" \
            aws s3 ls "s3://${STAGING_S3_BUCKET}/" --recursive \
              --endpoint-url "$STAGING_S3_ENDPOINT" --region "$STAGING_S3_REGION"
          }
          # Origem e destino têm credencial própria e vivem em projetos diferentes: um `aws s3 sync`
          # entre os dois exigiria uma credencial única com escrita na origem — exatamente o que a
          # origem não pode ter. Por isso a diferença é explícita e a cópia atravessa o runner.
          source_ls | awk '{ $1=""; $2=""; $3=""; sub(/^ +/, ""); print }' | sort > source.keys
          target_ls | awk '{ $1=""; $2=""; $3=""; sub(/^ +/, ""); print }' | sort > target.keys || : > target.keys
          comm -23 source.keys target.keys > missing.keys
          total="$(wc -l < missing.keys | tr -d ' ')"
          echo "objetos a copiar: ${total}"

          while IFS= read -r key; do
            [ -n "$key" ] || continue
            AWS_ACCESS_KEY_ID="$FISCAL_SOURCE_S3_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$FISCAL_SOURCE_S3_SECRET_ACCESS_KEY" \
            aws s3 cp "s3://${FISCAL_SOURCE_S3_BUCKET}/${key}" - --quiet \
              --endpoint-url "$FISCAL_SOURCE_S3_ENDPOINT" --region "$FISCAL_SOURCE_S3_REGION" \
            | AWS_ACCESS_KEY_ID="$STAGING_S3_ACCESS_KEY_ID" \
              AWS_SECRET_ACCESS_KEY="$STAGING_S3_SECRET_ACCESS_KEY" \
              aws s3 cp - "s3://${STAGING_S3_BUCKET}/${key}" --quiet \
                --endpoint-url "$STAGING_S3_ENDPOINT" --region "$STAGING_S3_REGION"
          done < missing.keys

      # Mesma leitura do `restore-test.yml`: o ciclo sai da última linha do manifesto, não do objeto
      # mais novo do bucket — ciclo que morreu no meio deixa `.enc` órfão e restaurar o órfão seria
      # copiar um banco pela metade para staging.
      - name: Baixar o ciclo de backup de produção
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY"
          fetch() {
            aws s3 cp "s3://${BACKUP_S3_BUCKET}/$1" "$2" \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --region "$BACKUP_S3_REGION" --quiet
          }
          fetch "db-backups/${SOURCE_BACKUP_ENVIRONMENT}/manifest.jsonl" manifest.jsonl
          stamp="$(tail -n 1 manifest.jsonl | jq -r .stamp)"
          grep -F "\"stamp\":\"${stamp}\"" manifest.jsonl > cycle.jsonl
          lines="$(wc -l < cycle.jsonl | tr -d ' ')"
          [ "$lines" -eq 2 ] || {
            echo "::error::o ciclo ${stamp} tem ${lines} linha(s), e um ciclo completo tem 2."
            exit 1
          }

          # **Só o banco da aplicação atravessa.** O do Keycloak fica onde está: o realm de staging
          # tem os próprios `redirect_uri`, client secret e usuários, todos apontando para o domínio
          # de staging. Restaurar o Keycloak de produção por cima trocaria isso pelos de produção e
          # derrubaria o login de staging inteiro — massa de nota não vale o ambiente.
          jq -r --arg name "$APPLICATION_DATABASE_NAME" 'select(.database == $name)' cycle.jsonl > application.jsonl
          [ -s application.jsonl ] || {
            echo "::error::o ciclo ${stamp} não tem linha para o banco '${APPLICATION_DATABASE_NAME}'."
            exit 1
          }
          key="$(jq -r .object application.jsonl)"
          fetch "$key" "$(basename "$key")"
          echo "ciclo escolhido: ${stamp} · banco: ${APPLICATION_DATABASE_NAME}"

      - name: Conferir o hash, decifrar e restaurar por cima de staging
        run: |
          set -euo pipefail
          file="$(basename "$(jq -r .object application.jsonl)")"
          echo "$(jq -r .sha256 application.jsonl)  ${file}" | sha256sum -c -
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -pass env:BACKUP_ENCRYPTION_KEY -in "$file" -out "${file%.enc}"

          # `--clean --if-exists` em vez de derrubar e recriar o banco: o Railway não entrega
          # conexão de manutenção, e `drop database` exigiria desconectar a app de staging inteira.
          # O `--clean` derruba objeto a objeto, e o que sobra de um schema antigo sai junto.
          pg_restore --dbname "$STAGING_DATABASE_URL" --clean --if-exists --no-owner \
            --no-privileges < "${file%.enc}"

      # Staging quase sempre está **à frente** de produção — é onde a branch publica primeiro. O
      # dump acabou de puxar o schema de produção para trás, e a app de staging, que espera o schema
      # novo, quebraria em toda rota que usa coluna que ainda não existe. Migrar aqui é o que fecha
      # essa distância; sem este passo o refresh derruba staging toda semana.
      - name: Migrar o schema restaurado até o nível do código de staging
        working-directory: apps/api-transportada
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run db:migrate

      # `stored_objects.bucket` guarda o nome do bucket de **quem escreveu** (a app resolve o dela
      # por `OBJECT_STORAGE_BUCKET`, `main.ts:resolveStorageBucket`). Sem esta reescrita toda linha
      # restaurada aponta para o bucket de produção, que a credencial de staging não lê — e cada
      # documento fiscal viraria um 404 silencioso, com o objeto ali do lado no bucket certo.
      - name: Reapontar os objetos armazenados para o bucket de staging
        run: |
          set -euo pipefail
          updated="$(psql "$STAGING_DATABASE_URL" --tuples-only --no-align --quiet -c \
            "with changed as (
               update stored_objects set bucket = '${STAGING_S3_BUCKET}'
               where bucket <> '${STAGING_S3_BUCKET}' returning 1
             ) select count(*) from changed")"
          echo "linhas reapontadas para '${STAGING_S3_BUCKET}': ${updated}"

      - name: Resumo
        run: |
          set -euo pipefail
          notes="$(psql "$STAGING_DATABASE_URL" --tuples-only --no-align --quiet \
            -c 'select count(*) from nfe_documents')"
          echo "### Staging espelhado" >> "$GITHUB_STEP_SUMMARY"
          echo "- notas fiscais em staging: **${notes}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- objetos copiados neste ciclo: **$(wc -l < missing.keys | tr -d ' ')**" >> "$GITHUB_STEP_SUMMARY"
