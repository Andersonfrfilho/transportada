name: Teste mensal de restore

# Backup que nunca voltou é arquivo, não backup. Uma vez por mês o ciclo mais recente é restaurado
# num Postgres efêmero e conferido contra o manifesto. Divergiu, o job falha e empurra o monitor
# como vermelho; o mês em que ninguém rodou nada é pego pela janela do `heartbeat.interval`.
on:
  schedule:
    - cron: '0 7 5 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Cliente mais velho que o servidor recusa o dump: o `pg_restore` que importa é o de dentro
      # desta imagem, não o do runner. A senha fixa não é credencial — o contêiner nasce e morre com
      # o job, sem porta publicada, e é o alvo descartável que a guarda do primeiro passo exige.
      postgres:
        # Digest, não tag: `postgres:18` é ponteiro móvel, e o teste de restauração perde o sentido
        # se a imagem que restaurou ontem não for a que restaura hoje.
        image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_ENVIRONMENT: ${{ vars.BACKUP_ENVIRONMENT }}
      RESTORE_HEARTBEAT_URL: ${{ secrets.RESTORE_HEARTBEAT_URL }}
      RESTORE_HEARTBEAT_TOKEN: ${{ secrets.RESTORE_HEARTBEAT_TOKEN }}
      RESTORE_TARGET_URL: postgresql://postgres:postgres@localhost:5432
    steps:
      # A guarda vem antes do download: alvo errado descoberto depois do `pg_restore` é tarde. Hoje a
      # URL é literal e é localhost — a checagem existe justamente para a edição de amanhã não
      # transformar um job de leitura num restore por cima de banco vivo.
      - name: Recusar qualquer alvo que não seja o Postgres efêmero
        run: |
          set -euo pipefail
          host="${RESTORE_TARGET_URL#*@}"
          host="${host%%:*}"
          if [ "$host" != localhost ]; then
            echo "::error::alvo '$host' não é o contêiner efêmero — este job nunca escreve em banco real."
            exit 1
          fi
          # O bucket de ops guarda os dois ambientes. Sem esta variável o caminho colapsa para
          # `db-backups//manifest.jsonl` e o job diria "verde" sobre um manifesto que não é de
          # ninguém — ou, pior, sobre o de staging.
          if [ -z "${BACKUP_ENVIRONMENT:-}" ]; then
            echo "::error::BACKUP_ENVIRONMENT vazio — o job não adivinha de qual ambiente é o backup."
            exit 1
          fi

      # O ciclo sai da última linha do manifesto, não do objeto mais novo do bucket: um ciclo que
      # morreu entre o upload da aplicação e o do Keycloak deixa `.enc` órfão e nenhuma linha, e
      # restaurar esse órfão diria "verde" sobre um backup pela metade.
      - name: Baixar o backup apontado pela última linha do manifesto
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY"
          fetch() {
            aws s3 cp "s3://${BACKUP_S3_BUCKET}/$1" "$2" \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --region "$BACKUP_S3_REGION" --quiet
          }
          fetch "db-backups/${BACKUP_ENVIRONMENT}/manifest.jsonl" manifest.jsonl
          stamp="$(tail -n 1 manifest.jsonl | jq -r .stamp)"
          grep -F "\"stamp\":\"${stamp}\"" manifest.jsonl > cycle.jsonl
          lines="$(wc -l < cycle.jsonl | tr -d ' ')"
          [ "$lines" -eq 2 ] || {
            echo "::error::o ciclo ${stamp} tem ${lines} linha(s) no manifesto, e um ciclo completo tem 2."
            exit 1
          }
          while IFS= read -r line <&3; do
            key="$(jq -r .object <<< "$line")"
            fetch "$key" "$(basename "$key")"
          done 3< cycle.jsonl
          echo "ciclo escolhido: ${stamp}"

      # Restaurar prova que o arquivo abre; comparar com o manifesto prova que ele é o banco.
      # O contexto `job` só existe aqui dentro: no `env` do job ele invalida o arquivo inteiro, e o
      # GitHub responde com um run sem step nenhum, que não diz o que houve.
      - name: Conferir o hash, decifrar e restaurar os dois bancos
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          query() {
            docker exec "$POSTGRES_CONTAINER" \
              psql "${RESTORE_TARGET_URL}/$1" --tuples-only --no-align --quiet -c "$2"
          }
          while IFS= read -r line <&3; do
            name="$(jq -r .database <<< "$line")"
            file="$(basename "$(jq -r .object <<< "$line")")"
            echo "$(jq -r .sha256 <<< "$line")  ${file}" | sha256sum -c -
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -pass env:BACKUP_ENCRYPTION_KEY -in "$file" -out "${file%.enc}"

            database="restore_${name}"
            query postgres "create database ${database}" > /dev/null
            docker exec -i "$POSTGRES_CONTAINER" \
              pg_restore --dbname "${RESTORE_TARGET_URL}/${database}" --no-owner < "${file%.enc}"

            tables="$(query "$database" "select count(*) from information_schema.tables
              where table_schema not in ('pg_catalog', 'information_schema') and table_type = 'BASE TABLE'")"
            migration=''
            if [ "$(query "$database" "select to_regclass('drizzle.__drizzle_migrations') is not null")" = t ]; then
              migration="$(query "$database" "select coalesce(max(name), '') from drizzle.__drizzle_migrations")"
            fi

            expected_tables="$(jq -r .tableCount <<< "$line")"
            expected_migration="$(jq -r .lastMigration <<< "$line")"
            [ "$tables" = "$expected_tables" ] || {
              echo "::error::${name}: restaurou ${tables} tabelas e o manifesto diz ${expected_tables}."
              exit 1
            }
            [ "$migration" = "$expected_migration" ] || {
              echo "::error::${name}: lastMigration '${migration}' e o manifesto diz '${expected_migration}'."
              exit 1
            }
            echo "${name}: ${tables} tabelas · lastMigration '${migration}' — confere com o manifesto"
          done 3< cycle.jsonl

      - name: Avisar o monitor que o restore fechou
        if: success()
        run: |
          set -euo pipefail
          # Ao contrário do backup, aqui a falta de configuração é falha declarada: um restore que
          # não avisa ninguém não vale como teste. O push é o do Gatus (ADR-0025).
          if [ -z "$RESTORE_HEARTBEAT_URL" ] || [ -z "$RESTORE_HEARTBEAT_TOKEN" ]; then
            echo "::error::RESTORE_HEARTBEAT_URL ou RESTORE_HEARTBEAT_TOKEN vazio — sem push não existe monitor de restore."
            exit 1
          fi
          # `--retry` porque a borda do Railway recusa de vez em quando: um 502 sozinho transformaria
          # restore bom em job vermelho e alerta falso.
          curl --silent --show-error --fail --retry 3 --retry-all-errors --max-time 30 \
            --output /dev/null --request POST \
            --header "Authorization: Bearer ${RESTORE_HEARTBEAT_TOKEN}" \
            "${RESTORE_HEARTBEAT_URL}?success=true"

      # A ausência do ping não serve de alerta aqui: a janela é de 32 dias, e o Gatus só avalia
      # heartbeat no tique do intervalo contado a partir do start do processo dele — descobriríamos
      # em setembro que o restore de agosto não fechou, quando descobríssemos. Quem falha avisa.
      - name: Avisar o monitor que o restore quebrou
        if: failure()
        run: |
          set -uo pipefail
          if [ -z "${RESTORE_HEARTBEAT_URL:-}" ] || [ -z "${RESTORE_HEARTBEAT_TOKEN:-}" ]; then
            echo "::warning::sem URL ou token de heartbeat — o monitor não ficou sabendo desta falha."
            exit 0
          fi
          # Sem `--fail` o 502 da borda sai com código 0 e o push some sem deixar rastro nenhum: o job
          # fica vermelho, o monitor nunca sabe. O job já está vermelho, então aqui nada pode falhar —
          # insistir em falhar só trocaria a causa que aparece no resumo do run, e a boa é a de cima.
          curl --silent --show-error --fail --retry 3 --retry-all-errors --max-time 30 \
            --output /dev/null --request POST \
            --header "Authorization: Bearer ${RESTORE_HEARTBEAT_TOKEN}" \
            "${RESTORE_HEARTBEAT_URL}?success=false" ||
            echo "::warning::o monitor recusou o push desta falha — o alerta desta quebra não saiu."
