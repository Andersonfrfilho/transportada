name: Deploy

# Cada ambiente é publicado pelo push da branch dele: `staging` publica staging, `main` publica
# produção. O PR entra aqui só pelo gate — a proteção da main exige os contextos `gate / quality` e
# `gate / integration`, que só existem se este workflow rodar no commit do PR.
#
# Publicar staging a partir do PR era a intenção original e nunca executou um passo sequer: a
# política de branch do ambiente casa com `refs/heads/*`, e o PR roda em `refs/pull/N/merge`. Desde
# 08/12/2025 o GitHub avalia a regra contra o ref de execução, e todo deploy de PR morria em
# "Branch is not allowed to deploy to staging" com zero passos. Abrir a política para
# `refs/pull/*/merge` entregaria o RAILWAY_TOKEN de staging ao merge ref — exatamente o que aquela
# mudança fechou — e publicaria um commit que não existe em branch nenhuma.
#
# O preço é o back-merge de main em staging redeployar conteúdo idêntico. Deploy é idempotente, e
# em troca staging passa a ser sempre o que está na branch staging.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo do deploy manual
        required: true
        type: choice
        options: [staging, production]
      deploy_identity:
        description: Forçar o deploy do Keycloak (derruba o login por alguns segundos)
        required: false
        default: false
        type: boolean
      force_all:
        description: Publicar todos os serviços, mesmo os que o diff não marcou
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Um grupo por PR: push novo no PR cancela o deploy anterior, que já é código velho em staging.
# `main` fica no grupo dele e nunca é cancelado — deploy de produção interrompido no meio deixa os
# cinco serviços em versões diferentes.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RAILWAY_CLI_VERSION: 4.58.0
  RAILWAY_PROJECT_ID: 62de4c69-216a-4335-93a0-4942c6a95c54

jobs:
  # Só há ambiente a resolver quando alguém publica: em PR este job e o `deploy` ficam de fora, e
  # sobra o `gate`, que é o que a proteção da main cobra.
  target:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            resolved="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            resolved=production
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            resolved=staging
          else
            # Sem fallback: branch sem ambiente falha em vez de publicar em staging por engano.
            echo "Branch '${{ github.ref_name }}' não tem ambiente. Use workflow_dispatch." >&2
            exit 1
          fi
          echo "environment=$resolved" >>"$GITHUB_OUTPUT"
          echo "Ambiente alvo: $resolved"

  # Quais serviços o commit mexeu. Roda também em PR — é ele que diz ao gate quais apps testar.
  #
  # Produção nunca filtra. Ter os sete serviços comprovadamente saídos do mesmo commit vale mais que
  # os minutos economizados: sem isso, "os serviços estão em `abc123`" vira sete perguntas separadas
  # justamente quando algo quebra. Em staging e no gate de PR o filtro é ganho puro.
  #
  # ⚠️ O frontend inlina `VITE_*` no bundle por `ARG` de build. Mudar `VITE_API_URL` no painel da
  # Railway exige rebuild e **não mexe em arquivo nenhum** — o diff pularia, e o bundle ficaria
  # apontando para a URL antiga sem nada indicando isso. Para esse caso existe o `force_all`.
  changes:
    needs: [target]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.detect.outputs.api }}
      frontend: ${{ steps.detect.outputs.frontend }}
      client: ${{ steps.detect.outputs.client }}
      landing: ${{ steps.detect.outputs.landing }}
      worker: ${{ steps.detect.outputs.worker }}
      cron: ${{ steps.detect.outputs.cron }}
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      # Mesmo motivo do job da API: o diff de um release compara com o commit anterior do push, que
      # num release de cem commits está muito além de um clone raso.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Os marcos dizem em que commit cada alvo está publicado. Sem eles o diff comparava com o
      # commit anterior do push — e um gate vermelho fazia o alvo perder o deploy para sempre, já
      # que o push seguinte não via mais a mudança.
      - name: Buscar os marcos de deploy
        run: git fetch --no-tags --quiet origin '+refs/deploy/*:refs/deploy/*' || true
      - id: detect
        env:
          MARKER_PREFIX: refs/deploy/${{ needs.target.outputs.environment }}
          # Alvo sem marco (ambiente novo) cai neste baseline. Em PR ele é a base do PR, não
          # `event.before` — que ali aponta para outra coisa.
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ (inputs.force_all || github.ref_name == 'main') && 'true' || 'false' }}
        run: .github/scripts/changed-targets.sh
      # O gate recebe nomes de diretório de `apps/`, não os nomes de serviço da Railway.
      - id: apps
        env:
          API: ${{ steps.detect.outputs.api }}
          WORKER: ${{ steps.detect.outputs.worker }}
          CRON: ${{ steps.detect.outputs.cron }}
          FRONTEND: ${{ steps.detect.outputs.frontend }}
          FRONTEND_CLIENT: ${{ steps.detect.outputs.client }}
          FRONTEND_LANDING: ${{ steps.detect.outputs.landing }}
        run: |
          selected=()
          # `if` em vez de `flag && push`: o runner roda o passo com `-e`, e um `&&` cujo teste é
          # falso devolve 1 — o passo morreria justamente no commit que não mexe na app.
          if [ "$API" = true ]; then selected+=('"api-transportada"'); fi
          if [ "$WORKER" = true ]; then selected+=('"worker-transportada"'); fi
          if [ "$CRON" = true ]; then selected+=('"cron-transportada"'); fi
          if [ "$FRONTEND" = true ]; then selected+=('"frontend-transportada"'); fi
          if [ "$FRONTEND_CLIENT" = true ]; then selected+=('"frontend-client"'); fi
          if [ "$FRONTEND_LANDING" = true ]; then selected+=('"frontend-landing"'); fi
          apps="[$(IFS=,; echo "${selected[*]-}")]"
          echo "apps=$apps" >>"$GITHUB_OUTPUT"
          echo "Apps no gate: $apps"

  gate:
    needs: changes
    uses: ./.github/workflows/ci.yml
    with:
      apps: ${{ needs.changes.outputs.apps }}

  # Três frentes em vez de uma fila. No release de produção `32172971566` o job único levou 646s com
  # os oito serviços em sequência, e a dependência real é uma só: worker e cron leem tabelas que a
  # migration da API cria. Nada mais espera nada — o frontend é bundle estático, e o cron e o worker
  # não se conhecem.
  #
  # O preço: cada job é um deployment próprio do Environment. Se o `production` ganhar revisor
  # obrigatório, passam a ser três aprovações por release, não uma.
  deploy-api:
    needs: [target, changes, gate]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      # Histórico completo: o diff do Keycloak compara com o commit anterior do push, que num release
      # de cem commits está muito além de um clone raso. Com profundidade truncada o diff falhava e o
      # passo lia a falha como "nada mudou" — foi assim que o tema de login ficou quatro dias fora.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy identity
        run: |
          # O baseline é o commit anterior do push. PR não chega aqui — não publica.
          baseline="${{ github.event.before }}"
          # Em `workflow_dispatch` não há `event.before`, e num push forçado ele pode ter sumido.
          # Baseline que não dá para conferir é dúvida, e dúvida publica: pular aqui é justamente o
          # silêncio que esconde tema novo. Alguns segundos de login fora custam menos.
          if [ -z "$baseline" ] || ! git cat-file -e "$baseline^{commit}"; then
            usable_baseline=false
          else
            usable_baseline=true
          fi
          if [ "${{ inputs.deploy_identity }}" = "true" ]; then
            reason="pedido manual"
          elif ! .github/scripts/railway-deploy.sh has-succeeded keycloak; then
            reason="primeiro deploy do ambiente"
          elif [ "$usable_baseline" = "false" ]; then
            reason="baseline indisponível em ${{ github.event_name }}: não há como saber se mudou"
          elif git diff --name-only "$baseline" HEAD | grep -q '^deploy/keycloak/'; then
            reason="mudança em deploy/keycloak"
          else
            echo "Keycloak inalterado: deploy pulado para não derrubar o login."
            exit 0
          fi
          echo "Deploy do Keycloak ($reason)."
          .github/scripts/railway-deploy.sh deploy keycloak
      # Depois de publicar, e sempre: `--import-realm` não atualiza realm existente, então a
      # configuração do `realm.json` só vale se alguém a aplicar. Reconciliar é barato; descobrir
      # semanas depois que a tela de login do cliente está errada, não.
      - name: Reconciliar realm
        run: .github/scripts/keycloak-reconcile.sh
      # A API roda as migrations no preDeployCommand, e é por isso que ela é o gargalo declarado:
      # worker e cron só começam quando este job termina verde.
      - name: Deploy API
        run: .github/scripts/railway-deploy.sh deploy api
      - name: Conferir migrations aplicadas
        run: .github/scripts/railway-deploy.sh assert-migrations api

  # O frontend é bundle estático servido por nginx: não abre conexão com o banco e não lê tabela
  # nenhuma, então não tem por que esperar migration. Era o passo mais lento da fila (147s) e agora
  # começa no instante zero, junto com a API.
  deploy-frontend:
    needs: [target, changes, gate]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy frontend
        run: .github/scripts/railway-deploy.sh deploy transportada-frontend

  # A landing é bundle estático e público: não depende de migration nem do painel, e por isso sobe
  # em paralelo com todo o resto.
  deploy-landing:
    needs: [target, changes, gate]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy landing
        run: .github/scripts/railway-deploy.sh deploy landing

  # O portal do contratante é bundle estático como a landing, e sobe pelo mesmo motivo em paralelo:
  # não depende de migration nem do painel. A separação de bundle é da ADR-0050 §1 — servir o painel
  # a um usuário externo dependeria de toda condicional de permissão no cliente estar certa, para
  # sempre; serviço próprio faz disso um erro impossível, e é por isso que ele tem job próprio aqui
  # em vez de carona no `deploy-frontend`.
  deploy-client:
    needs: [target, changes, gate]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy client
        run: .github/scripts/railway-deploy.sh deploy client

  # Worker e cron consomem tabelas que a migration da API cria: `needs: deploy-api` é a única ordem
  # que importa. Entre eles não há ordem alguma, e cada um roda no seu runner — a paralelização não
  # cabe num job só porque `railway-deploy.sh` reescreve `~/.railway/config.json` a cada chamada, e
  # duas chamadas simultâneas no mesmo runner disputariam o mesmo arquivo.
  #
  # `fail-fast: false` porque cancelar os irmãos quando um falha produz o pior estado possível:
  # metade dos serviços na versão nova, metade na antiga, e nenhum sinal de qual é qual.
  #
  # A lista é literal no arquivo de propósito: é dela que o contrato de nomes lê para conferir que
  # todo serviço publicado tem diretório de build declarado em `docs/spec/railway.md`.
  deploy-services:
    needs: [target, changes, gate, deploy-api]
    # ⚠️ `needs: deploy-api` sozinho tem uma armadilha: job pulado propaga o `skipped` para quem
    # depende dele, então API inalterada + worker alterado deixaria o worker sem publicar, em
    # silêncio. `always()` desliga essa propagação — e obriga a conferir falha e cancelamento na
    # mão, porque `always()` também ignora esses. A ordem que importa continua de pé: se a API
    # publicou, foi antes; se falhou, ninguém sobe contra um banco sem a migration.
    #
    # ⚠️ E obriga a conferir o gate na mão também, que é o que faltava: gate vermelho deixa
    # `deploy-api` em `skipped`, e `skipped` não é `failure` nem `cancelled` — a condição passava e
    # worker e cron publicavam contra um gate reprovado (run `33072726734`). `deploy-api` e
    # `deploy-frontend` não precisam dizer isto porque não usam `always()`: neles o `needs: gate`
    # já segura sozinho.
    if: >-
      always()
      && needs.target.result == 'success'
      && needs.gate.result == 'success'
      && needs.deploy-api.result != 'failure'
      && needs.deploy-api.result != 'cancelled'
      && (needs.changes.outputs.worker == 'true' || needs.changes.outputs.cron == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: [worker, cron]
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      # Duas apps, dois serviços, um filtro para cada. O cron era quatro serviços separados pela
      # variável `CRON_JOB`; hoje é uma batida só (spec 052), e quem escolhe a rotina é o relógio
      # em `job_schedules`, não o painel do provedor de hospedagem.
      - name: Deploy ${{ matrix.service }}
        if: >-
          (matrix.service == 'worker' && needs.changes.outputs.worker == 'true'
          || matrix.service == 'cron' && needs.changes.outputs.cron == 'true')
        run: .github/scripts/railway-deploy.sh deploy "${{ matrix.service }}"

  # O marco só avança onde o ambiente de fato ficou com este commit. É o que impede a regressão que
  # motivou este job: gate vermelho pulava o deploy, o push seguinte comparava contra o commit
  # anterior dele, a mudança saía do diff e o alvo ficava para trás sem ninguém perceber.
  mark-deployed:
    needs:
      [target, changes, deploy-api, deploy-frontend, deploy-landing, deploy-client, deploy-services]
    if: always() && needs.target.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Avançar o marco de cada alvo publicado
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.deploy-api.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
          LANDING_CHANGED: ${{ needs.changes.outputs.landing }}
          LANDING_RESULT: ${{ needs.deploy-landing.result }}
          CLIENT_CHANGED: ${{ needs.changes.outputs.client }}
          CLIENT_RESULT: ${{ needs.deploy-client.result }}
          # Worker e cron compartilham o job em matriz: o resultado é um só para os dois.
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
          WORKER_RESULT: ${{ needs.deploy-services.result }}
          CRON_CHANGED: ${{ needs.changes.outputs.cron }}
          CRON_RESULT: ${{ needs.deploy-services.result }}
        run: .github/scripts/mark-deployed.sh
