name: Deploy

# Cada ambiente é publicado pelo push da branch dele: `staging` publica staging, `main` publica
# produção. O PR entra aqui só pelo gate — a proteção da main exige os contextos `gate / quality` e
# `gate / integration`, que só existem se este workflow rodar no commit do PR.
#
# Publicar staging a partir do PR era a intenção original e nunca executou um passo sequer: a
# política de branch do ambiente casa com `refs/heads/*`, e o PR roda em `refs/pull/N/merge`. Desde
# 08/12/2025 o GitHub avalia a regra contra o ref de execução, e todo deploy de PR morria em
# "Branch is not allowed to deploy to staging" com zero passos. Abrir a política para
# `refs/pull/*/merge` entregaria o RAILWAY_TOKEN de staging ao merge ref — exatamente o que aquela
# mudança fechou — e publicaria um commit que não existe em branch nenhuma.
#
# O preço é o back-merge de main em staging redeployar conteúdo idêntico. Deploy é idempotente, e
# em troca staging passa a ser sempre o que está na branch staging.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo do deploy manual
        required: true
        type: choice
        options: [staging, production]
      deploy_identity:
        description: Forçar o deploy do Keycloak (derruba o login por alguns segundos)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Um grupo por PR: push novo no PR cancela o deploy anterior, que já é código velho em staging.
# `main` fica no grupo dele e nunca é cancelado — deploy de produção interrompido no meio deixa os
# cinco serviços em versões diferentes.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RAILWAY_CLI_VERSION: 4.58.0
  RAILWAY_PROJECT_ID: 62de4c69-216a-4335-93a0-4942c6a95c54

jobs:
  # Só há ambiente a resolver quando alguém publica: em PR este job e o `deploy` ficam de fora, e
  # sobra o `gate`, que é o que a proteção da main cobra.
  target:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            resolved="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            resolved=production
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            resolved=staging
          else
            # Sem fallback: branch sem ambiente falha em vez de publicar em staging por engano.
            echo "Branch '${{ github.ref_name }}' não tem ambiente. Use workflow_dispatch." >&2
            exit 1
          fi
          echo "environment=$resolved" >>"$GITHUB_OUTPUT"
          echo "Ambiente alvo: $resolved"

  gate:
    uses: ./.github/workflows/ci.yml

  # Três frentes em vez de uma fila. No release de produção `32172971566` o job único levou 646s com
  # os oito serviços em sequência, e a dependência real é uma só: worker e crons leem tabelas que a
  # migration da API cria. Nada mais espera nada — o frontend é bundle estático e os crons não se
  # conhecem.
  #
  # O preço: cada job é um deployment próprio do Environment. Se o `production` ganhar revisor
  # obrigatório, passam a ser três aprovações por release, não uma.
  deploy-api:
    needs: [target, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      # Histórico completo: o diff do Keycloak compara com o commit anterior do push, que num release
      # de cem commits está muito além de um clone raso. Com profundidade truncada o diff falhava e o
      # passo lia a falha como "nada mudou" — foi assim que o tema de login ficou quatro dias fora.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy identity
        run: |
          # O baseline é o commit anterior do push. PR não chega aqui — não publica.
          baseline="${{ github.event.before }}"
          # Em `workflow_dispatch` não há `event.before`, e num push forçado ele pode ter sumido.
          # Baseline que não dá para conferir é dúvida, e dúvida publica: pular aqui é justamente o
          # silêncio que esconde tema novo. Alguns segundos de login fora custam menos.
          if [ -z "$baseline" ] || ! git cat-file -e "$baseline^{commit}"; then
            usable_baseline=false
          else
            usable_baseline=true
          fi
          if [ "${{ inputs.deploy_identity }}" = "true" ]; then
            reason="pedido manual"
          elif ! .github/scripts/railway-deploy.sh has-succeeded keycloak; then
            reason="primeiro deploy do ambiente"
          elif [ "$usable_baseline" = "false" ]; then
            reason="baseline indisponível em ${{ github.event_name }}: não há como saber se mudou"
          elif git diff --name-only "$baseline" HEAD | grep -q '^deploy/keycloak/'; then
            reason="mudança em deploy/keycloak"
          else
            echo "Keycloak inalterado: deploy pulado para não derrubar o login."
            exit 0
          fi
          echo "Deploy do Keycloak ($reason)."
          .github/scripts/railway-deploy.sh deploy keycloak
      # Depois de publicar, e sempre: `--import-realm` não atualiza realm existente, então a
      # configuração do `realm.json` só vale se alguém a aplicar. Reconciliar é barato; descobrir
      # semanas depois que a tela de login do cliente está errada, não.
      - name: Reconciliar realm
        run: .github/scripts/keycloak-reconcile.sh
      # A API roda as migrations no preDeployCommand, e é por isso que ela é o gargalo declarado:
      # worker e crons só começam quando este job termina verde.
      - name: Deploy API
        run: .github/scripts/railway-deploy.sh deploy api
      - name: Conferir migrations aplicadas
        run: .github/scripts/railway-deploy.sh assert-migrations api

  # O frontend é bundle estático servido por nginx: não abre conexão com o banco e não lê tabela
  # nenhuma, então não tem por que esperar migration. Era o passo mais lento da fila (147s) e agora
  # começa no instante zero, junto com a API.
  deploy-frontend:
    needs: [target, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Deploy frontend
        run: .github/scripts/railway-deploy.sh deploy transportada-frontend

  # Worker e crons consomem tabelas que a migration da API cria: `needs: deploy-api` é a única ordem
  # que importa. Entre eles não há ordem alguma, e cada um roda no seu runner — a paralelização não
  # cabe num job só porque `railway-deploy.sh` reescreve `~/.railway/config.json` a cada chamada, e
  # duas chamadas simultâneas no mesmo runner disputariam o mesmo arquivo.
  #
  # `fail-fast: false` porque cancelar os irmãos quando um falha produz o pior estado possível:
  # metade dos serviços na versão nova, metade na antiga, e nenhum sinal de qual é qual.
  #
  # A lista é literal no arquivo de propósito: é dela que o contrato de nomes lê para conferir que
  # todo serviço publicado tem diretório de build declarado em `docs/spec/railway.md`.
  deploy-services:
    needs: [target, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: [worker, cron, cron-nfse, cron-notifications, cron-fuel]
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      # A Nota RP publica um servidor só, e é o de produção: não há ambiente onde exercitar a
      # reconciliação sem mexer em nota real, e esta instalação tem um cadastro só. A NFS-e é
      # trilho de produção por decisão (ADR-0035), não por variável esquecida. Em staging o passo
      # é pulado e o job termina verde sem publicar nada.
      - name: Deploy ${{ matrix.service }}
        if: matrix.service != 'cron-nfse' || needs.target.outputs.environment == 'production'
        run: .github/scripts/railway-deploy.sh deploy "${{ matrix.service }}"
