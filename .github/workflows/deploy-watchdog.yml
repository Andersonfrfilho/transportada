name: Deploy watchdog

# Destranca o deploy quando um job fica `queued` sem runner. O defeito é do lado do GitHub e já
# aconteceu duas vezes em 02/10/2026: o run preso segura a concorrência da branch
# (`deploy-<branch>`, `cancel-in-progress: false` de propósito) e todo merge seguinte fica `pending`
# sem criar um único job — o merge entra e o deploy não roda, sem nenhum erro.
#
# A lógica de decisão mora em `.github/scripts/deploy-watchdog.ts`, com contrato em
# `test/deploy-watchdog.contract.test.ts`. Duas travas valem mais que o resto: nunca cancela run que
# tenha job em andamento (interromper deploy no meio deixa serviços em versões diferentes) e só
# refaz o deploy quando o run preso era o commit mais novo da branch.
#
# Agendamento do GitHub é "melhor esforço" e só dispara a partir da branch padrão — por isso este
# arquivo só vale depois de entrar na `main`.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# `actions: write` é o mínimo para cancelar e refazer run; o script só toca o workflow `deploy.yml`.
permissions:
  actions: write
  contents: read

# Um tick novo substitui o anterior: se um tick ficasse preso pelo mesmo defeito que ele existe para
# curar, todos os seguintes esperariam atrás dele e o watchdog trancaria a si mesmo.
concurrency:
  group: deploy-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun .github/scripts/deploy-watchdog.main.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
