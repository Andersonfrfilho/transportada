name: CI

# Sem gatilho próprio: o `deploy.yml` chama este workflow como gate, e ele roda no PR mirando
# staging e no push para main. Um `pull_request` aqui seria a mesma suíte duas vezes no mesmo
# commit — quality e integration, com Playwright, migration-test e docker compose.
on:
  workflow_call:
    inputs:
      apps:
        description: JSON com as apps que o commit alterou; a suíte roda só nelas.
        required: true
        type: string

permissions:
  contents: read

# Cada chamada fica no seu próprio grupo: o gate nunca é cancelado nem enfileirado atrás de outro
# deploy. Quem cancela run velho de PR é o `concurrency` do `deploy.yml`, que derruba o run inteiro.
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Uma app por runner, e só as que o commit tocou. Antes era um job só rodando lint, typecheck,
  # test e build das quatro em sequência — quatro vezes o `bun install`, quatro vezes o `tsc`, e um
  # PR de frontend pagando pela suíte da API. As apps não importam código-fonte umas das outras
  # (não existe `packages/`), então nada aqui compartilha estado com o job ao lado.
  #
  # `apps` chega vazio quando o commit só mexeu em `docs/` ou `specs/`: matriz sem valor é erro de
  # sintaxe no GitHub, por isso o `if` — e o `quality` abaixo continua reportando verde.
  quality-app:
    if: inputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Chaveado no lockfile: o `bun install --frozen-lockfile` só baixa o que mudou desde o cache,
      # em vez de buscar tudo de novo em cada um dos ~13 jobs que instalam nesta mesma suíte.
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # O lockfile é da raiz e o workspace é um só: instalar tudo é o que o `--frozen-lockfile`
      # sabe fazer, e é o que o build da app espera encontrar em `node_modules`.
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/${{ matrix.app }} lint
      - run: bun run --cwd apps/${{ matrix.app }} typecheck
      # A sonda de CSP do design system (`box-dimension-scanner-csp.contract.ts`) sobe um Chromium
      # headless e mede o que o navegador de fato bloqueia — sem este passo ela pulava em 100% das
      # execuções de CI, e "pular não é passar" (spec 092). Só o frontend a tem; as outras apps não
      # pagam o download.
      - name: Install Playwright Chromium
        if: matrix.app == 'frontend-transportada'
        run: bun run --cwd apps/frontend-transportada playwright install --with-deps chromium
      - run: bun run --cwd apps/${{ matrix.app }} test
      - run: bun run --cwd apps/${{ matrix.app }} build

  # É **este** nome que a proteção da main exige como `gate / quality`, e é por isso que ele existe
  # separado da matriz: com matriz os contextos viram `gate / quality (api)`, um nome por app, e a
  # regra de proteção passaria a esperar checks cujo conjunto muda a cada commit — PR que não toca
  # na API travaria para sempre esperando `gate / quality (api)`.
  #
  # `always()` porque um job pulado não é uma falha, e um job vermelho precisa chegar aqui para ser
  # reprovado: sem ele, matriz vermelha com `fail-fast: false` deixaria este job simplesmente não
  # rodar, e o contexto exigido nunca reportaria.
  quality:
    if: always()
    needs: quality-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # Prettier varre o repositório inteiro, incluindo `docs/`, `specs/` e os próprios workflows:
      # não é de app nenhuma, e recortá-lo por app deixaria markdown e YAML sem formatação conferida.
      - run: bun run format:check
      - name: Conferir a matriz
        run: |
          result='${{ needs.quality-app.result }}'
          # `skipped` é o caso legítimo de commit que não tocou em app alguma. `failure` e
          # `cancelled` reprovam: quem decide o verde do gate é este passo, não o `fail-fast`.
          case "$result" in
            success|skipped) echo "quality-app: $result" ;;
            *) echo "::error::quality-app terminou em $result"; exit 1 ;;
          esac

  # Sem `needs: quality`. Roda ao lado da matriz de qualidade, e por dentro roda em 4 frentes que
  # não trocam artefato entre si — o gate só passa se todas passarem, e o tempo de parede vira o da
  # mais lenta, não a soma.
  #
  # Medido em 2026-09-27: com os quatro num job só, o passo único de integração da API sozinho já
  # levava 22-23 min (717 testes, 135 arquivos) — a suíte cresceu (spec 183, 211...) e passou a
  # bater no teto de 30 quatro rodadas seguidas, sempre no mesmo lugar, sem nenhum teste ou passo
  # travado (conferido pelos timestamps do log: maior intervalo entre linhas foi de 4.5s). Dividir
  # por sharding é o item que o comentário antigo já previa ("se passar de 30, é hora de dividir").
  #
  # `worker-integration` já sobe sua própria dupla postgres+rabbitmq e migra seu próprio banco
  # (`provision-integration-database.ts`) — não depende do banco compartilhado nem do
  # `migration-test`, por isso é job à parte e não um shard a mais.
  integration-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cp .env.example .env
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: make migration-test

  # `test:integration` da API usa o banco compartilhado (`DATABASE_URL` do `.env`), então cada shard
  # sobe o próprio Postgres e só aplica as migrations pendentes (`make migrate`) — não a validação de
  # rollback inteira do `migration-test`, que já roda uma vez no job acima e não precisa se repetir
  # 4 vezes. `--shard=N/4` é suporte nativo do `bun test`, que reparte por arquivo.
  integration-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Reservar as portas da stack local
        run: |
          ports=51025,53000-53003,53100-53102,53110-53112,53200,54000-54999,55432,55672-55673,58025,58080,59000-59002
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=$ports"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cp .env.example .env
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: make up SERVICES="postgres rabbitmq keycloak mailpit"
      - run: make migrate
      - name: API integration (shard ${{ matrix.shard }}/4)
        run: |
          set -a
          . ./.env
          set +a
          bun run --cwd apps/api-transportada test:integration --shard=${{ matrix.shard }}/4
      - if: always()
        run: make down

  integration-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Sem isto o `WORKER_PORT` sorteado em 54000-54999 pelo teste de SIGTERM pode cair numa porta
      # de saída já em uso, e o worker "some no boot" (exit 1, sem log) — o mesmo incidente que
      # justificava esta reserva no job único antigo, antes da divisão em frentes paralelas.
      - name: Reservar as portas da stack local
        run: |
          ports=51025,53000-53003,53100-53102,53110-53112,53200,54000-54999,55432,55672-55673,58025,58080,59000-59002
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=$ports"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cp .env.example .env
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: make worker-integration
      - if: always()
        run: make down

  # O único dos quatro que ainda depende de `identity-bootstrap` (realm do Keycloak, seed local) e
  # do Playwright — os outros três nunca abrem um navegador nem tocam o Keycloak de verdade.
  integration-smoke:
    runs-on: ubuntu-latest
    # Folga de mais de 10 min sobre o teto do passo de apt (5 min) — contrato em
    # test/deploy/integration-gate.contract.ts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # O runner do GitHub sorteia porta de origem em 32768-60999 e não reserva nenhuma
      # (`ip_local_reserved_ports` vem vazio). Toda porta que publicamos cai dentro dessa faixa, então
      # qualquer conexão de saída — `bun install`, download do Playwright, `docker pull` — pode ficar
      # com uma delas e derrubar o `bind` seguinte. Aconteceu duas vezes seguidas no mesmo gate, com
      # sintomas que não se pareciam: o Keycloak morreu em "address already in use" na 59002, e o
      # worker do teste de SIGTERM (`WORKER_PORT` sorteado em 54000-54999) sumiu no boot.
      # Reservá-las é dizer ao kernel para nunca sorteá-las; nenhuma delas é de saída.
      - name: Reservar as portas da stack local
        run: |
          # 53003 é a landing do `make dev`, e 53110-53111 são os previews que o Playwright sobe
          # (painel e landing). Ficaram de fora quando a 53112 do motorista entrou, e porta
          # publicada fora da reserva é porta que o kernel pode sortear como origem.
          ports=51025,53000-53003,53100-53102,53110-53112,53200,54000-54999,55432,55672-55673,58025,58080,59000-59002
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=$ports"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cp .env.example .env
      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # `--with-deps` juntava duas coisas de risco muito diferente: baixar o Chromium do CDN do
      # Playwright, que é rápido e cacheável, e virar root para `apt-get update`, que fala com
      # espelho de distribuição. Em 19/08/2026 o espelho da Azure não respondeu (`Ign:` repetido), o
      # apt caiu no `archive.ubuntu.com` e ficou 19 minutos parado — duas execuções seguidas comeram
      # o teto de 20 do job com zero teste rodado. Separados, o binário vem do cache e só o apt
      # precisa de teto (portado de main, #43 — aqui só o smoke ainda usa Playwright).
      - name: Cache do Chromium do Playwright
        uses: actions/cache@v4
        with:
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          path: ~/.cache/ms-playwright
      - name: Install Playwright Chromium
        run: bun run --cwd apps/frontend-transportada playwright install chromium
      # Teto próprio: espelho pendurado vira passo vermelho em 5 minutos, com nome, em vez de gate
      # cancelado no fim do job sem dizer onde parou.
      - name: Bibliotecas de sistema do Chromium
        timeout-minutes: 5
        run: bun run --cwd apps/frontend-transportada playwright install-deps chromium
      - run: make identity-bootstrap
      - name: Local authenticated smoke
        run: |
          make dev SERVICES="postgres rabbitmq keycloak mailpit" >"$RUNNER_TEMP/transportada-dev.log" 2>&1 &
          dev_pid=$!
          cleanup() {
            kill "$dev_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://localhost:53000/ \
              && curl --fail --silent --output /dev/null http://localhost:53001/health/live \
              && curl --fail --silent --output /dev/null http://localhost:53002/health/live; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/transportada-dev.log"
            exit 1
          fi

          make smoke
      - if: always()
        run: make down

  # É **este** nome que a proteção da main/staging exige como `gate / integration` — mesmo padrão
  # do agregador `quality` acima: sem ele, `fail-fast: false` na matriz de shards deixaria uma
  # falha isolada nunca reprovar o gate.
  integration:
    if: always()
    needs: [integration-migration, integration-api, integration-worker, integration-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir as quatro frentes
        run: |
          # `needs.*` não existe na linguagem de expressão do GitHub Actions — não é jq. Cada
          # dependência entra por nome, como o `quality` já faz para a sua única.
          for result in \
            "${{ needs.integration-migration.result }}" \
            "${{ needs.integration-api.result }}" \
            "${{ needs.integration-worker.result }}" \
            "${{ needs.integration-smoke.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::uma frente de integração terminou em $result"; exit 1 ;;
            esac
          done
          echo "integration: migration=${{ needs.integration-migration.result }} api=${{ needs.integration-api.result }} worker=${{ needs.integration-worker.result }} smoke=${{ needs.integration-smoke.result }}"
