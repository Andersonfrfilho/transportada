# De qual Keycloak os templates deste tema foram copiados.
#
# O tema herda de `base` e reescreve alguns templates. Cópia não recebe correção de cima: quando a
# imagem sobe de versão, os templates do `base` mudam — campo novo, macro nova, chave de mensagem
# nova — e estes seguem na forma antiga sem erro nenhum. A tela continua com a nossa marca, passa no
# smoke do `keycloak-reconcile.sh`, e falta o que o Keycloak novo espera.
#
# Ao subir a imagem em `deploy/keycloak/Dockerfile` e `compose.yaml`, antes de mudar este arquivo:
#
#   docker run --rm --entrypoint sh quay.io/keycloak/keycloak:<versão> \
#     -c 'cat /opt/keycloak/themes/base/login/<template>'
#
# comparar com a nossa cópia, trazer o que mudou de cima, e só então atualizar a versão aqui. O
# contrato `test/deploy/keycloak-theme-fork.contract.ts` reprova enquanto os dois discordarem.

keycloak.version=26.5.2
forked.templates=footer.ftl login.ftl template.ftl
