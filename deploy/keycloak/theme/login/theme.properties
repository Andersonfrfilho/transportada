parent=base
styles=css/login.css
scripts=js/password-reset-link.js js/password-visibility.js

# Hash do conteúdo do tema, carimbado pelo `deploy/keycloak/Dockerfile` no build da imagem: o
# `template.ftl` o põe como `?v=` em todo recurso nosso. `dev` só sobra no compose, que monta o tema.
resourcesVersion=dev

kcFormGroupClass=field
kcLabelClass=field-label
kcInputClass=field-input
kcInputGroup=field-control
kcInputErrorMessageClass=field-error
kcFormOptionsClass=form-options
kcFormOptionsWrapperClass=form-options-links
kcFormSettingClass=form-settings
kcFormButtonsClass=form-actions
kcButtonClass=action
kcButtonPrimaryClass=action-primary
kcButtonBlockClass=action-block
kcAlertClass=notice
kcAlertTitleClass=notice-text
kcContentWrapperClass=content
kcLabelWrapperClass=content
kcSignUpClass=panel-footnote
kcInfoAreaWrapperClass=panel-footnote

# As páginas herdadas do `base` desenham o olho da senha e o botão secundário com estas chaves. Sem
# mapeamento o olho vira um botão sem classe, e como `.field-control` empilha os filhos na mesma
# célula ele cobre o campo inteiro com a caixa cinza do navegador — foi assim que a tela de troca de
# senha ficou com dois quadrados por cima dos campos.
kcButtonDefaultClass=action-quiet
kcFormPasswordVisibilityButtonClass=field-reveal
kcFormPasswordVisibilityIconShow=field-reveal-icon
kcFormPasswordVisibilityIconHide=field-reveal-icon

# O ambiente do deploy, para a aba do login avisar quando não é produção — igual à app.
#
# ⚠️ **Lista fechada, e ausente cai em produção.** O Keycloak resolve `${env.VAR}` aqui, mas quando a
# variável não existe ele deixa o **literal** `${env.TRANSPORTADA_APP_ENV}` no valor — medido em
# container de sonda. O default do FreeMarker nunca dispara, porque a propriedade tem conteúdo. Por
# isso o template compara com os valores conhecidos em vez de testar vazio: variável esquecida no
# painel de hospedagem não pode fazer a instalação do cliente pedir desculpas.
appEnvironment=${env.TRANSPORTADA_APP_ENV}

# A origem do app, para o "Trocar de usuário" da tela só de senha voltar à identificação do app. É a mesma
# variável que o realm usa nas `redirectUris`, então não há URL cravada por ambiente.
#
# ⚠️ **Fallback, não a fonte principal.** Quem manda é o `redirect_uri` da requisição de login — a
# origem de onde a pessoa veio, painel ou portal —; esta variável só entra quando ele não existir. Um
# deploy com painel e portal no mesmo realm não pode mandar todo mundo de volta para um único
# destino fixo. Ausente, o valor é o literal `${env.…}` — o `login.ftl` só usa o que começa com
# `http` como `data-fallback-origin`.
applicationOrigin=${env.KEYCLOAK_FRONTEND_ORIGIN}

# A origem da API, de onde o tema lê o nome e o logo da transportadora (`/public/landing-*`). Ausente,
# o valor é o literal `${env.…}` e o `template.ftl` só usa o que começa com `http`: sem API, a marca
# segue sendo o `displayName` do realm. A origem do Keycloak precisa estar no `FRONTEND_ORIGIN` da API.
brandApiOrigin=${env.KEYCLOAK_BRAND_API_ORIGIN}
