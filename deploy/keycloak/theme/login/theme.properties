# As páginas herdadas do `base` desenham o olho da senha e o botão secundário com estas chaves. Sem
# mapeamento o olho vira um botão sem classe, e como `.field-control` empilha os filhos na mesma
# célula ele cobre o campo inteiro com a caixa cinza do navegador — foi assim que a tela de troca de
# senha ficou com dois quadrados por cima dos campos.
kcButtonDefaultClass=action-quiet
kcFormPasswordVisibilityButtonClass=field-reveal
kcFormPasswordVisibilityIconShow=field-reveal-icon
kcFormPasswordVisibilityIconHide=field-reveal-icon
