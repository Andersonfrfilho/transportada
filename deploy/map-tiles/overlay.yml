#
# Feature 089 (fase 2) — o overlay do radar. O esquema OpenMapTiles do basemap não tem
# `speed_camera` (medido: 70 radares no OSM da região, zero nas telhas — ver
# specs/089-o-mapa-mostra-sentido-pedagio-e-radar/evidence.md). Este arquivo é o SEGUNDO
# `generate-custom`, sobre o MESMO `.osm.pbf` já baixado para o basemap — nunca um segundo
# download — e produz um SEGUNDO PMTiles (`overlay.pmtiles`), nunca um fork do perfil OpenMapTiles:
# manter um fork do perfil pronto obrigaria a reassar o basemap inteiro a cada mudança, com o mapa
# que hoje funciona como risco (decisão em plan.md, T002).
schema_name: Radares de velocidade
schema_description: highway=speed_camera do OSM, para o overlay do mapa de rota
sources:
  osm:
    type: osm
    local_path: /data/area.osm.pbf

layers:
  # Zoom 11: mesmo patamar em que a camada `poi` do basemap começa a existir (metadados do
  # PMTiles) — abaixo disso não há o que mostrar num mapa de região.
  - id: radar
    features:
      - source: osm
        geometry: point
        min_zoom: 11
        include_when:
          highway: speed_camera
        attributes:
          - key: class
            value: speed_camera
          # Feature 096 T5 — a velocidade permitida ao lado do ícone.
          #
          # Medido em 2026-09-07 no `ribeirao.osm.pbf`: 527 radares, **438 com `maxspeed`** (83%) —
          # 40 (110×), 60 (108×), 110 (61×), 50 (52×). Os 89 sem a tag entram **sem número**: um
          # radar existe mesmo quando ninguém mapeou o limite, e imprimir "60" porque é o valor mais
          # comum seria inventar o número que o motorista vai obedecer.
          - key: maxspeed
            tag_value: maxspeed
          # ⚠️ 12 radares declaram limite próprio de caminhão, e é ele que interessa a quem opera
          # frota — em rodovia brasileira o limite do caminhão é menor que o do carro. O estilo
          # prefere este quando existir.
          - key: maxspeed_hgv
            tag_value: maxspeed:hgv
          # ⚠️ 49 radares dizem o sentido em que fiscalizam. Sem isso o mapa marca fiscalização na
          # pista contrária — a mesma armadilha de sentido que o pedágio resolve por identidade de nó.
          - key: direction
            tag_value: direction
