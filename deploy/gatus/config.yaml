#
# Monitoramento como arquivo: quem vigia a instalação é revisado no mesmo pull request que o muda, e
# nasce igual em toda transportadora nova. Decisão e alternativas descartadas em ADR-0025.
#
# Todo valor entre `${}` vem do ambiente — esta configuração é versionada e não guarda segredo.

storage:
  # Histórico em memória some no restart, e com ele a prova de que o ciclo de ontem pingou.
  type: sqlite
  path: /data/gatus.db

ui:
  title: Monitoramento ǀ TransportAdA
  dashboard-heading: TransportAdA

# Quem entra é quem o realm diz que é operador. Nenhuma senha local, nenhuma segunda lista de
# pessoas para envelhecer em silêncio ao lado do Keycloak.
security:
  oidc:
    issuer-url: ${GATUS_OIDC_ISSUER_URL}
    redirect-url: ${GATUS_PUBLIC_URL}/authorization-code/callback
    client-id: ${GATUS_OIDC_CLIENT_ID}
    client-secret: ${GATUS_OIDC_CLIENT_SECRET}
    scopes: ['openid']

# O servidor é o da instalação (`deploy/ntfy/`), não o ntfy.sh público. Lá o POST estourava em
# timeout e, porque o envio falhava, o Gatus nem marcava o alerta como disparado — a queda e a volta
# se perdiam juntas. Dependência que não avisa quando para de aceitar você não serve de canal.
alerting:
  ntfy:
    url: ${GATUS_NTFY_URL}
    topic: ${GATUS_NTFY_TOPIC}
    token: ${GATUS_NTFY_TOKEN}
    priority: 4

# O que o backup e o teste de restore empurram. `heartbeat.interval` é o alerta: passou a janela sem
# ping, o monitor cai sozinho. `failure-threshold: 1` porque o padrão de três falhas seguidas, num
# ciclo diário, avisaria no terceiro dia sem backup — e `success-threshold: 1` pelo mesmo motivo do
# outro lado: o padrão espera dois ciclos verdes, o que faria o "voltou" do backup chegar dois dias
# depois e o do restore, dois meses. Repetição serve para desconfiar do que oscila, e push não
# oscila: ou o ciclo fechou, ou não fechou.
external-endpoints:
  - name: backup
    group: staging
    token: ${GATUS_BACKUP_STAGING_TOKEN}
    heartbeat:
      interval: 26h
    alerts:
      - type: ntfy
        description: staging ficou um dia sem ciclo de backup verde
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Mensal, a janela sozinha avisaria em setembro que o restore de agosto não fechou — por isso o
  # workflow também empurra `success=false` quando quebra, e a janela sobra para o mês sem execução.
  - name: restore
    group: staging
    token: ${GATUS_RESTORE_STAGING_TOKEN}
    heartbeat:
      interval: 768h
    alerts:
      - type: ntfy
        description: o teste mensal de restore de staging não fechou
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  # Production repete a forma de staging e não repete o segredo. Um por monitor é o que impede o
  # ciclo de um ambiente de fechar o monitor do outro e esconder a janela que ficou sem cópia.
  - name: backup
    group: production
    token: ${GATUS_BACKUP_PRODUCTION_TOKEN}
    heartbeat:
      interval: 26h
    alerts:
      - type: ntfy
        description: production ficou um dia sem ciclo de backup verde
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

  - name: restore
    group: production
    token: ${GATUS_RESTORE_PRODUCTION_TOKEN}
    heartbeat:
      interval: 768h
    alerts:
      - type: ntfy
        description: o teste mensal de restore de production não fechou
        failure-threshold: 1
        success-threshold: 1
        send-on-resolved: true

# Vigiado de fora, pelo domínio público: o projeto de ops é outro projeto Railway justamente para
# não morrer junto com o que ele observa.
endpoints:
  - name: api
    group: staging
    url: ${GATUS_STAGING_API_URL}/health/ready
    interval: 2m
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy
        description: a API de staging parou de responder no /health/ready
        send-on-resolved: true

  # A variável guarda a URL do realm (`https://<host>/realms/<realm>`), e o caminho do documento de
  # descoberta é sufixo fixo aqui — trocar de instalação não deve poder trocar o que é vigiado.
  #
  # O caminho importa. Em 10/08/2026 o Keycloak de production ficou horas sem alcançar o Postgres e
  # ninguém entrou no produto, com o painel inteiro verde: não havia monitor de Keycloak, e o
  # `/certs` — candidato óbvio — respondia 200 de memória durante a queda inteira. O documento de
  # descoberta lê a configuração do realm no banco e cai junto com ele.
  - name: keycloak
    group: staging
    url: ${GATUS_STAGING_KEYCLOAK_URL}/.well-known/openid-configuration
    interval: 2m
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy
        description: o Keycloak de staging parou de servir a descoberta do realm
        send-on-resolved: true

  - name: frontend
    group: staging
    url: ${GATUS_STAGING_FRONTEND_URL}
    interval: 2m
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy
        description: o frontend de staging parou de responder
        send-on-resolved: true

  - name: api
    group: production
    url: ${GATUS_PRODUCTION_API_URL}/health/ready
    interval: 2m
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy
        description: a API de production parou de responder no /health/ready
        send-on-resolved: true

  - name: keycloak
    group: production
    url: ${GATUS_PRODUCTION_KEYCLOAK_URL}/.well-known/openid-configuration
    interval: 2m
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy
        description: o Keycloak de production parou de servir a descoberta do realm
        send-on-resolved: true

  - name: frontend
    group: production
    url: ${GATUS_PRODUCTION_FRONTEND_URL}
    interval: 2m
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy
        description: o frontend de production parou de responder
        send-on-resolved: true
