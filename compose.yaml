services:
  postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: transportada
      POSTGRES_USER: transportada
      POSTGRES_PASSWORD: transportada
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transportada -d transportada']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33
    environment:
      RABBITMQ_DEFAULT_USER: transportada
      RABBITMQ_DEFAULT_PASS: transportada
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-55672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-55673}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local-password
    ports:
      - '127.0.0.1:${MINIO_PORT:-59000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit@sha256:3bd7c2f2696deb35a4780d152b404dceec99cb041b942c0877b3b22384714f85
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025'

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2@sha256:fb31a59deb46f746f2aaa25adc5da39ceccac4fd22d36a519562b0bf02e8df20
    command: start-dev --import-realm --hostname=http://localhost:${KEYCLOAK_PORT}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_PORT: '9000'
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_WORKER_CLIENT_SECRET: ${KEYCLOAK_WORKER_CLIENT_SECRET}
      KEYCLOAK_LOCAL_USER_PASSWORD: ${KEYCLOAK_LOCAL_USER_PASSWORD}
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT}:8080'
      - '127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT}:9000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '{ printf "HEAD /health/ready HTTP/1.0\\r\\n\\r\\n" >&0; grep "HTTP/1.0 200"; } 0<>/dev/tcp/localhost/9000',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      # ⚠️ Monta o **realm**, não o diretório: `--import-realm` lê tudo que houver em
      # `data/import` como RealmRepresentation, e recusa campo desconhecido. Com o diretório
      # inteiro montado, `spa-redirect-uris.json` — que não é realm — derrubava o Keycloak no
      # boot com `Unrecognized field "_comment"`, e com ele todo o `make up` e todo o deploy.
      - ./realm/transportada-local-realm.json:/opt/keycloak/data/import/transportada-local-realm.json:ro
      - ./deploy/keycloak/theme:/opt/keycloak/themes/transportada:ro

  # ADR-0044 §2: a matriz de estrada é hospedada por nós. O `/table` devolve N×N em milissegundos, e
  # é isso que permite ao solver ler a matriz milhares de vezes por sugestão sem pagar por elemento.
  # O `.osrm` vem do extract OSM da área de operação — ver docs/runbooks/osrm-extract.md.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    # Opt-in: o serviço precisa de um extract OSM de centenas de MB que não cabe no repositório nem
    # num `make up` de máquina nova. `make routing-up` o sobe depois do runbook; sem ele, a sugestão
    # de roteiro falha com ROUTING_MATRIX_UNAVAILABLE, que é o comportamento correto (ADR-0044 §1).
    profiles: ['routing']
    command: osrm-routed --algorithm mld --max-table-size ${OSRM_MAX_TABLE_SIZE:-2000} /data/${OSRM_DATASET:-area}.osrm
    ports:
      - '127.0.0.1:${OSRM_PORT:-53005}:5000'
    healthcheck:
      # ⚠️ `wget`, e não `/dev/tcp`: o `/bin/sh` desta imagem é o BusyBox, que não implementa a
      # redireção de socket do bash — o healthcheck anterior falhava com "nonexistent directory" em
      # **todo** dataset, e `make routing-up` (que usa `--wait`) nunca ficava pronto. Ninguém tinha
      # rodado o serviço até o E2E da spec 058 pedir por ele.
      #
      # A sonda é `/route` de um ponto para ele mesmo: se responde, o processo subiu e leu o dataset.
      # A URL vai **entre aspas** e em `127.0.0.1`: o `;` do par de coordenadas é separador de comando
      # no shell (sem aspas a sonda vira dois comandos, e o segundo, `0,0`, não existe), e `localhost`
      # resolve para IPv6 dentro do contêiner, onde o OSRM não escuta.
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:5000/route/v1/driving/0,0;0,0"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    volumes:
      - ./deploy/osrm/data:/data:ro

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
